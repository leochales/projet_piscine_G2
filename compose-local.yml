# Usage : docker compose -f compose-local.yml up -d (-d permet de lancer le compose en mode détaché)
# Les variables ${...} sont lues dans le fichier .env (copie de env.example).
#
# Point d'entrée unique : Traefik sur http://localhost
#   /       -> front (nginx)
#   /api    -> API FastAPI (Swagger : /api/docs)
# Tableau de bord Traefik : http://localhost:8080
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      # Routes déclarées par les labels des conteneurs, seulement ceux avec traefik.enable=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=enervision_proxy
      - --entrypoints.web.address=:80
      # Tableau de bord sans authentification : réservé au local (port lié à 127.0.0.1)
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Lecture seule : Traefik ne fait que lister les conteneurs et leurs labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_network

  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mots de passe des comptes des services
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
      MODEL_DB_PASSWORD: ${MODEL_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Serveur EnerVision déclaré automatiquement (lu au premier lancement seulement)
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  api:
    build:
      context: .                  # racine : l'API embarque aussi common/
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      POSTGRES_HOST: db           # nom du service Postgres
      POSTGRES_PORT: 5432         # port interne au réseau Docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: api
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network          # accès à la base
      - proxy_network             # joignable par Traefik

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: etl
    environment:
      ETL_ENABLED: ${ETL_ENABLED:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOCK_API_URL: ${MOCK_API_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: front
    labels:
      - traefik.enable=true
      # Tout ce qui n'est pas /api (règle plus longue, donc prioritaire) va au front
      - traefik.http.routers.front.rule=PathPrefix(`/`)
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.services.front.loadbalancer.server.port=80
    depends_on:
      - api
    networks:
      - proxy_network             # pas d'accès à la base

volumes:
  postgresql_data:
  pgadmin_data:

networks:
  postgres_network:
  # Réseau de Traefik : seuls les services exposés en HTTP y sont branchés.
  # Nom fixé : sans lui, Compose le préfixe (projet_piscine_g2_...) et Traefik
  # (--providers.docker.network) ne le reconnaît pas pour l'API, branchée sur deux réseaux.
  proxy_network:
    name: enervision_proxy
