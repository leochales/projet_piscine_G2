# Usage : docker compose -f compose-local.yml up -d (-d permet de lancer le compose en mode détaché)
# Les variables ${...} sont lues dans le fichier .env (copie de env.example).
services:
  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  api:
    build:
      context: .                  # racine : l'API embarque aussi common/
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      POSTGRES_HOST: db           # nom du service Postgres
      POSTGRES_PORT: 5432         # port interne au réseau Docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: etl
    environment:
      ETL_ENABLED: ${ETL_ENABLED:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: front
    ports:
      - "127.0.0.1:${FRONT_PORT:-5173}:80"
    depends_on:
      - api
    networks:
      - postgres_network

volumes:
  postgresql_data:
  pgadmin_data:

networks:
  postgres_network:
