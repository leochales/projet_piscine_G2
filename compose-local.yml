# Usage : docker compose -f compose-local.yml up -d (-d permet de lancer le compose en mode détaché)
# Les variables ${...} sont lues dans le fichier .env (copie de env.example).
#
# Point d'entrée unique : Traefik sur http://localhost
#   /         -> front (nginx)
#   /api      -> API FastAPI (Swagger : /api/docs)
#   /grafana  -> Grafana (profil monitoring)
#   /auth     -> Keycloak (console : /auth/admin)
# Tableau de bord Traefik : http://localhost:8080
#
# Supervision (Prometheus, Grafana, Loki, Alloy, postgres-exporter) : profil « monitoring »,
# non démarré par défaut (~1 Go de mémoire). L'activer avec :
#   docker compose -f compose-local.yml --profile monitoring up -d
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      # Routes déclarées par les labels des conteneurs, seulement ceux avec traefik.enable=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=enervision_proxy
      - --entrypoints.web.address=:80
      # Tableau de bord sans authentification : réservé au local (port lié à 127.0.0.1)
      - --api.dashboard=true
      - --api.insecure=true
      # Métriques Prometheus sur un entrypoint interne (port 8082, non publié)
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --entrypoints.metrics.address=:8082
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Lecture seule : Traefik ne fait que lister les conteneurs et leurs labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_network

  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mots de passe des comptes des services
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
      MODEL_DB_PASSWORD: ${MODEL_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Facultatif : sans lui, le compte monitoring ne peut pas se connecter
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-}
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Serveur EnerVision déclaré automatiquement (lu au premier lancement seulement)
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Adresses du front autorisées en retour de connexion (redirectUris du realm)
      FRONT_URL: ${FRONT_URL:-http://localhost}
      FRONT_DEV_URL: ${FRONT_DEV_URL:-http://localhost:5173}
      # Servi par Traefik sous /auth, comme sur la VM. L'adresse publique fixe l'émetteur
      # (iss) des jetons ; l'API joint quand même Keycloak en interne (keycloak:8080/auth).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${FRONT_URL:-http://localhost}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-enervision.json:/opt/keycloak/data/import/realm-enervision.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    healthcheck:
      # Port de gestion (9000), sous le même chemin relatif que Keycloak
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Démarrage lent (reconstruction de la configuration, jusqu'à 3 min sur un poste
      # chargé) : les échecs ne comptent pas pendant ce délai. Tant que Keycloak n'est
      # pas « healthy », Traefik ne le route pas et /auth tombe sur le front.
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network
      - proxy_network             # joignable par Traefik

  api:
    build:
      context: .                  # racine : l'API embarque aussi common/
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      POSTGRES_HOST: db           # nom du service Postgres
      POSTGRES_PORT: 5432         # port interne au réseau Docker
      POSTGRES_DB: ${POSTGRES_DB}
      PRIX_KWH_EUR: ${PRIX_KWH_EUR:-0.14}
      POSTGRES_USER: api
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network          # accès à la base
      - proxy_network             # joignable par Traefik

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: etl
    environment:
      ETL_ENABLED: ${ETL_ENABLED:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: ${ETL_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:*
      --static-prefix /mlflow
    volumes:
      - mlflow_data:/mlflow
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlflow.rule=PathPrefix(`/mlflow`)
      - traefik.http.routers.mlflow.entrypoints=web
      - traefik.http.services.mlflow.loadbalancer.server.port=5000
    networks:
      - proxy_network

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: front
    labels:
      - traefik.enable=true
      # Tout ce qui n'est pas /api (règle plus longue, donc prioritaire) va au front
      - traefik.http.routers.front.rule=PathPrefix(`/`)
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.services.front.loadbalancer.server.port=80
    depends_on:
      - api
    networks:
      - proxy_network             # pas d'accès à la base

  # ---------------------------------------------------------------------------
  # Supervision (profil monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_network
      - proxy_network             # lit les métriques de Traefik et de l'API

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network
      - monitoring_network

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    profiles: [monitoring]
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    profiles: [monitoring]
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Lecture seule : Alloy liste les conteneurs et lit leurs logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring_network

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    profiles: [monitoring]
    environment:
      # Servi sous /grafana par Traefik (sans retirer le préfixe)
      GF_SERVER_ROOT_URL: http://localhost:${HTTP_PORT:-80}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Sources de données et tableaux de bord décrits dans le dépôt
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring_network
      - proxy_network             # joignable par Traefik

volumes:
  postgresql_data:
  pgadmin_data:
  prometheus_data:
  loki_data:
  grafana_data:
  mlflow_data:

networks:
  postgres_network:
  # Réseau de Traefik : seuls les services exposés en HTTP y sont branchés.
  # Nom fixé : sans lui, Compose le préfixe (projet_piscine_g2_...) et Traefik
  # (--providers.docker.network) ne le reconnaît pas pour l'API, branchée sur deux réseaux.
  proxy_network:
    name: enervision_proxy
  # Réseau de la supervision : Prometheus, Grafana, Loki, Alloy et postgres-exporter
  monitoring_network:
