<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnerVision</title>
    <!-- Thème appliqué avant le démarrage de Vue, pour éviter un flash clair.
         Même clé et même règle que src/lib/theme.ts (« auto » ou rien : réglage du système). -->
    <script>
      try {
        var theme = localStorage.getItem('enervision-theme')
        if (theme === 'dark' || ((!theme || theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
