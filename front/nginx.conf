server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Attention : un add_header dans une location annule ceux du niveau server. Un en-tête
  # commun à toutes les réponses doit être répété dans chaque location (les en-têtes de
  # sécurité, eux, sont posés par Traefik : SMARTOPS-87).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Les routes Vue Router (/sites/SITE002...) retombent sur index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
