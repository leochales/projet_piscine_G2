name: API contract

# Schemathesis génère des requêtes à partir du contrat OpenAPI de l'API
# (/api/openapi.json) et vérifie que les réponses le respectent
# (pas d'erreur 500, codes et schémas de réponse déclarés).

on:
  pull_request:
    branches: [develop, main]
  # Appelé par deploy.yml : rien n'est déployé sans ce contrôle
  workflow_call:

# Nom de groupe fixe : voir pre-commit.yml
concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: enervision
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: enervision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enervision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: enervision
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: enervision
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install API and Schemathesis
        run: pip install -r api/requirements.txt schemathesis==4.29.4

      - name: Create database schema
        env:
          PGPASSWORD: ci
        run: |
          for f in db/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U enervision -d enervision -f "$f"
          done

      - name: Start API
        run: |
          uvicorn api.main:app --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Schemathesis
        run: schemathesis run http://localhost:8000/api/openapi.json --checks all
