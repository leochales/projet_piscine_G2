name: Deploy
on:
  push:
    # dev (develop) se déploie uniquement à la main, via workflow_dispatch
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Les conditions if: évitent les déploiements par erreur depuis une autre branche.
  # Elles ne protègent pas les secrets PROD_* : sans GitHub Environments (plan Free),
  # tout collaborateur ayant les droits d'écriture peut les lire (voir infra/runner.md).
  checks:
    name: Checks
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/pre-commit.yml

  security:
    name: Security
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/security.yml

  # Build unique, test de la stack (contrat d'API compris), scan, puis publication sur GHCR
  images:
    name: Images
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/images.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    needs: [checks, security, images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: read
      # Téléchargement des images publiées par le job images
      packages: read
    env:
      # Lu par compose-prod.yml : projet Docker enervision-<env>, entrypoint Traefik https-<env>
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      # Images testées et publiées pour ce commit (IMAGE_REPO : voir l'étape « Noms des images »)
      IMAGE_TAG: ${{ github.sha }}
      # Préfixe des secrets et variables GitHub de l'environnement
      ENV_PREFIX: ${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}
      # Port HTTPS de l'environnement sur le Traefik partagé (infra/traefik/compose.yml)
      HTTPS_PORT: ${{ github.ref_name == 'main' && '443' || '8443' }}
      # Variables et secrets de l'environnement, déclarés une fois pour toutes les étapes :
      # compose-prod.yml les interpole à chaque commande docker compose (pull, migration,
      # démarrage). Le contexte env n'existant pas encore ici, le préfixe PROD/DEV est
      # recalculé dans chaque expression au lieu de lire ENV_PREFIX.
      # Toutes les étapes du job reçoivent donc ces secrets, y compris actions/checkout :
      # risque accepté, les actions étant fixées par leur SHA. Le jeton GHCR, lui, reste
      # limité à l'étape « Récupérer les images ».
      POSTGRES_USER: ${{ vars[format('{0}_POSTGRES_USER', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      POSTGRES_DB: ${{ vars[format('{0}_POSTGRES_DB', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      ETL_ENABLED: ${{ vars[format('{0}_ETL_ENABLED', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      KEYCLOAK_ADMIN: ${{ vars[format('{0}_KEYCLOAK_ADMIN', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      POSTGRES_PASSWORD: ${{ secrets[format('{0}_POSTGRES_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      ETL_DB_PASSWORD: ${{ secrets[format('{0}_ETL_DB_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      MODEL_DB_PASSWORD: ${{ secrets[format('{0}_MODEL_DB_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      API_DB_PASSWORD: ${{ secrets[format('{0}_API_DB_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      BACKUP_DB_PASSWORD: ${{ secrets[format('{0}_BACKUP_DB_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets[format('{0}_KEYCLOAK_ADMIN_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      KEYCLOAK_DB_PASSWORD: ${{ secrets[format('{0}_KEYCLOAK_DB_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets[format('{0}_KEYCLOAK_ADMIN_CLIENT_SECRET', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      # Mot de passe des comptes de démonstration, créés par l'API à son démarrage
      # (api/seed.py). Facultatif : sans lui, l'API n'en crée pas
      SEED_PASSWORD: ${{ secrets[format('{0}_SEED_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      # Supervision : Grafana et le compte PostgreSQL monitoring, dev et prod
      GRAFANA_ADMIN_PASSWORD: ${{ secrets[format('{0}_GRAFANA_ADMIN_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      MONITORING_DB_PASSWORD: ${{ secrets[format('{0}_MONITORING_DB_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      # Sauvegarde : clé de chiffrement restic et SAS du conteneur restic-<env> ; le compte
      # de stockage (infra/terraform) est commun à dev et prod
      RESTIC_PASSWORD: ${{ secrets[format('{0}_RESTIC_PASSWORD', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      AZURE_ACCOUNT_SAS: ${{ secrets[format('{0}_AZURE_ACCOUNT_SAS', github.ref_name == 'main' && 'PROD' || 'DEV')] }}
      AZURE_ACCOUNT_NAME: ${{ vars.AZURE_ACCOUNT_NAME }}
      # Adresse publique du front (redirectUris de Keycloak) : https://<VM_IP> en prod,
      # https://<VM_IP>:8443 en dev. Le port 443 est omis, comme dans l'adresse du navigateur.
      FRONT_URL: ${{ format('https://{0}{1}', vars.VM_IP, github.ref_name != 'main' && ':8443' || '') }}
      # Seul nom d'hôte accepté par les routes Traefik (règle Host de compose-prod.yml)
      PUBLIC_HOST: ${{ vars.VM_IP }}
      # Swagger et openapi.json masqués en prod (routes pas encore protégées par Keycloak)
      API_DOCS_ENABLED: ${{ github.ref_name == 'main' && 'false' || 'true' }}
    steps:
      # Pas de jeton dans .git/config : le runner de la VM conserve ses fichiers entre les jobs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Même calcul que dans images.yml (GHCR exige des minuscules)
      - name: Noms des images
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Empreinte du dossier du thème de connexion dans ce commit : label du conteneur
      # keycloak (compose-prod.yml), qui est recréé quand le thème change. Hash complet :
      # un préfixe (--short) s'allonge quand le dépôt grandit, ce qui changerait le label
      # et recréerait Keycloak sans modification du thème
      - name: Version du thème Keycloak
        run: echo "KEYCLOAK_THEME_VERSION=$(git rev-parse HEAD:infra/keycloak/themes/enervision)" >> "$GITHUB_ENV"

      # Certificat auto-signé de la VM (pas de domaine ni d'accès Internet entrant) :
      # généré une seule fois et conservé hors du dossier de travail, pour que l'exception
      # acceptée dans les navigateurs reste valable. Régénéré si l'IP de la VM change.
      - name: Préparer le certificat HTTPS
        id: cert
        env:
          VM_IP: ${{ vars.VM_IP }}
        run: |
          if [ -z "$VM_IP" ]; then
            echo "::error::Variable VM_IP manquante (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          cert_dir="$HOME/traefik-certs"
          echo "TLS_CERT_DIR=$cert_dir" >> "$GITHUB_ENV"
          cert="$cert_dir/cert.pem"
          # Conservé s'il couvre l'IP actuelle et reste valide plus de 30 jours.
          # Une entrée SAN par ligne, comparée en entier et sans regex (-xF).
          if openssl x509 -in "$cert" -noout -checkend 2592000 >/dev/null 2>&1 \
             && openssl x509 -in "$cert" -noout -ext subjectAltName | tr ',' '\n' | sed 's/^ *//' \
                | grep -qxF "IP Address:${VM_IP}"; then
            echo "Certificat existant conservé"
            exit 0
          fi
          mkdir -p "$cert_dir" && chmod 700 "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
            -subj "/CN=${VM_IP}" -addext "subjectAltName=IP:${VM_IP}" \
            -keyout "$cert_dir/key.pem" -out "$cert"
          chmod 600 "$cert_dir/key.pem"
          echo "renewed=true" >> "$GITHUB_OUTPUT"

      # Partagé par dev et prod ; sans effet si sa configuration n'a pas changé
      - name: Démarrer le Traefik partagé
        env:
          CERT_RENEWED: ${{ steps.cert.outputs.renewed }}
        run: |
          docker compose -f infra/traefik/compose.yml up -d --remove-orphans
          # Traefik ne relit pas les fichiers de certificat d'un conteneur déjà démarré
          if [ "$CERT_RENEWED" = "true" ]; then
            docker compose -f infra/traefik/compose.yml restart traefik
          fi

      # Avant toute action sur la VM : un secret manquant arrêterait sinon le déploiement
      # au milieu (base migrée, conteneurs non démarrés).
      - name: Vérifier les secrets
        run: |
          # ETL_ENABLED est facultatif (true par défaut dans compose-prod.yml)
          missing=0
          for key in POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD ETL_DB_PASSWORD \
                     MODEL_DB_PASSWORD API_DB_PASSWORD BACKUP_DB_PASSWORD \
                     KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_DB_PASSWORD \
                     KEYCLOAK_ADMIN_CLIENT_SECRET RESTIC_PASSWORD AZURE_ACCOUNT_SAS \
                     GRAFANA_ADMIN_PASSWORD MONITORING_DB_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::${ENV_PREFIX}_${key} manquant (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          # Variable commune à dev et prod (sans préfixe)
          if [ -z "$AZURE_ACCOUNT_NAME" ]; then
            echo "::error::Variable AZURE_ACCOUNT_NAME manquante (Settings → Secrets and variables → Actions → Variables)"
            missing=1
          fi
          exit "$missing"

      # Images testées et scannées par images.yml : aucune reconstruction sur la VM.
      # Le jeton GHCR n'est donné qu'à cette étape, et retiré dès la fin du téléchargement,
      # même en cas d'échec.
      - name: Récupérer les images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose -f compose-prod.yml --profile jobs pull --quiet

      # Images publiques (Docker Hub), absentes du pull GHCR ci-dessus. Sans elles,
      # le up --pull never ne pourrait pas démarrer Grafana.
      - name: Récupérer les images de supervision
        run: |
          docker compose -f compose-prod.yml pull \
            prometheus postgres-exporter loki alloy grafana

      # Données brutes du jeu d'entraînement (DVC, data/raw.dvc) : vérifie, sans rien
      # copier ni installer, que le stockage DVC de la VM contient la version du commit.
      # Sans effet sur l'application : un échec n'arrête pas le déploiement.
      - name: Vérifier les données du jeu d'entraînement
        continue-on-error: true
        env:
          DVC_STORE: ${{ vars.DVC_STORE }}
        run: |
          if ! python3 infra/dataset/pull.py --check; then
            echo "::warning::Données du jeu absentes du stockage DVC de la VM (dvc push depuis un poste, voir infra/runner.md) : le workflow Dataset ne pourra pas construire le jeu"
            exit 1
          fi

      # Les scripts de db/ ne tournent qu'à la création du volume : migrate.sh les rejoue
      # tous sur la base existante (nouvelles tables, comptes, droits, mots de passe).
      # Avant le démarrage des nouvelles images, qui peuvent dépendre du nouveau schéma.
      - name: Migrer la base
        run: |
          docker compose -f compose-prod.yml up -d --no-build --pull never db
          # -h 127.0.0.1 : au premier démarrage, le serveur temporaire de l'initialisation
          # n'écoute que sur le socket local ; on attend le vrai serveur, scripts terminés.
          ready=false
          for _ in $(seq 1 60); do
            if docker compose -f compose-prod.yml exec -T db \
                 pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::PostgreSQL ne répond pas après 120 s : migration et déploiement annulés"
            docker compose -p "enervision-${DEPLOY_ENV}" logs --tail=50 db
            exit 1
          fi
          docker compose -f compose-prod.yml exec -T db bash /docker-entrypoint-initdb.d/tools/migrate.sh

      - name: Déployer
        run: docker compose -f compose-prod.yml up -d --no-build --pull never --remove-orphans

      # Conteneur du job créé sans être démarré : le nettoyage ci-dessous garde ainsi l'image
      # du modèle de la version déployée, que le workflow Dataset lance à la demande
      - name: Préparer le job du jeu d'entraînement
        run: docker compose -f compose-prod.yml create --no-build --pull never dataset

      # Passe par Traefik comme un client (-k : certificat auto-signé). --resolve : la
      # requête vise l'IP publique (règle Host de Traefik) mais part vers 127.0.0.1.
      - name: Vérifier la santé de l'API
        run: |
          for _ in $(seq 1 30); do
            if curl -fsSk --resolve "${PUBLIC_HOST}:${HTTPS_PORT}:127.0.0.1" \
                 "https://${PUBLIC_HOST}:${HTTPS_PORT}/api/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'API ($DEPLOY_ENV, port $HTTPS_PORT) ne répond pas après 60 s"
          # -p : le projet suffit, sans réinterpoler compose-prod.yml (et donc sans les secrets)
          docker compose -p "enervision-${DEPLOY_ENV}" ps
          docker compose -p "enervision-${DEPLOY_ENV}" logs --tail=50 api
          exit 1

      # L'application tourne déjà : un Grafana absent ou pas prêt n'arrête pas
      # le déploiement (Keycloak et le nettoyage suivent).
      - name: Vérifier Grafana
        continue-on-error: true
        run: |
          for _ in $(seq 1 30); do
            if curl -fsSk --resolve "${PUBLIC_HOST}:${HTTPS_PORT}:127.0.0.1" \
                 "https://${PUBLIC_HOST}:${HTTPS_PORT}/grafana/api/health"; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Grafana ($DEPLOY_ENV, port $HTTPS_PORT) ne répond pas après 60 s"
          docker compose -p "enervision-${DEPLOY_ENV}" ps
          docker compose -p "enervision-${DEPLOY_ENV}" logs --tail=50 grafana
          exit 1

      # Console d'administration exposée : le realm master bloque un compte après 5 mots de
      # passe faux (15 min, puis plus longtemps). Le realm enervision n'est importé qu'au
      # premier démarrage : son thème de connexion (en français seul) est donc aussi
      # appliqué ici. Un échec (Keycloak pas démarré, mot de passe administrateur changé
      # dans Keycloak depuis le premier démarrage) n'arrête pas le déploiement.
      - name: Configurer les realms Keycloak
        continue-on-error: true
        env:
          # Client du scan ZAP : dev seulement (job zap)
          ZAP_CLIENT_SECRET: ${{ github.ref_name != 'main' && secrets.DEV_ZAP_CLIENT_SECRET || '' }}
        run: |
          # Keycloak recréé (thème modifié) : son healthcheck (compose-prod.yml) reste à
          # « starting » tant qu'il démarre, jusqu'à 5 min (start_period) puis 30 sondes de
          # 10 s avant « unhealthy ». On attend tant qu'il démarre, 12 min au plus.
          keycloak_id=$(docker compose -p "enervision-${DEPLOY_ENV}" ps -q keycloak)
          etat_keycloak() { docker inspect -f '{{.State.Health.Status}}' "$keycloak_id"; }
          for _ in $(seq 144); do
            [ "$(etat_keycloak)" = starting ] || break
            sleep 5
          done
          etat=$(etat_keycloak)
          if [ "$etat" != healthy ]; then
            echo "::warning::Keycloak ($DEPLOY_ENV) à l'état « $etat » : realms master et enervision non configurés"
            exit 1
          fi
          kcadm() {
            docker compose -f compose-prod.yml exec -T -e KC_CLI_PASSWORD keycloak \
              /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm-deploy.config
          }
          # Jeton de session kcadm : effacé du conteneur, même en cas d'échec
          trap 'docker compose -f compose-prod.yml exec -T keycloak rm -f /tmp/kcadm-deploy.config' EXIT
          if ! KC_CLI_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" kcadm config credentials \
               --server http://localhost:8080/auth --realm master --user "$KEYCLOAK_ADMIN"; then
            echo "::warning::Connexion kcadm refusée ($DEPLOY_ENV) : protection du realm master non vérifiée"
            exit 1
          fi
          kcadm update realms/master -s bruteForceProtected=true -s failureFactor=5 \
            -s waitIncrementSeconds=900 -s maxFailureWaitSeconds=3600 -s permanentLockout=false
          kcadm update realms/enervision -s loginTheme=enervision -s 'supportedLocales=["fr"]'
          # Client du scan ZAP authentifié (job zap), jamais en prod : seul client du realm à
          # accepter identifiant et mot de passe (directAccessGrants), protégé par son secret.
          # Jetons valables 30 min (5 min pour le realm) : la durée maximale du scan.
          # Description JSON envoyée sur l'entrée standard : le secret n'apparaît pas dans ps.
          if [ "$DEPLOY_ENV" = dev ]; then
            if [ -z "$ZAP_CLIENT_SECRET" ]; then
              echo "::warning::DEV_ZAP_CLIENT_SECRET manquant : client enervision-zap non configuré, scan ZAP authentifié impossible"
              exit 1
            fi
            client_zap=$(python3 -c '
          import json, os
          print(json.dumps({
              "clientId": "enervision-zap",
              "name": "Scan ZAP (dev)",
              "enabled": True,
              "protocol": "openid-connect",
              "publicClient": False,
              "clientAuthenticatorType": "client-secret",
              "secret": os.environ["ZAP_CLIENT_SECRET"],
              "standardFlowEnabled": False,
              "implicitFlowEnabled": False,
              "directAccessGrantsEnabled": True,
              "serviceAccountsEnabled": False,
              "attributes": {"access.token.lifespan": "1800"},
              # Même audience que le front : l API refuse sinon le jeton
              "protocolMappers": [{
                  "name": "audience-enervision-api",
                  "protocol": "openid-connect",
                  "protocolMapper": "oidc-audience-mapper",
                  "consentRequired": False,
                  "config": {
                      "included.client.audience": "enervision-api",
                      "id.token.claim": "false",
                      "access.token.claim": "true",
                      "introspection.token.claim": "true",
                  },
              }],
          }))')
            id_zap=$(kcadm get clients -r enervision -q clientId=enervision-zap \
                       --fields id --format csv --noquotes)
            if [ -z "$id_zap" ]; then
              printf '%s' "$client_zap" | kcadm create clients -r enervision -f -
            else
              # Les mappers ne sont pas modifiés par une mise à jour : créés une seule fois
              printf '%s' "$client_zap" | kcadm update "clients/${id_zap}" -r enervision -f -
            fi
          fi

      # Images orphelines, et anciennes versions de nos images qu'aucun conteneur
      # (dev ou prod) n'utilise plus. Elles restent récupérables sur GHCR.
      - name: Nettoyer les anciennes images
        if: always()
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          docker image prune -f
          docker image prune -af --filter "label=org.opencontainers.image.source=${REPO_URL}"

  # Scans DAST (ZAP) de l'environnement dev qui vient d'être déployé, jamais de la prod :
  # baseline passif du front, puis scan actif de l'API (contrat OpenAPI, servi en dev
  # seulement) avec le jeton d'un compte de démo en lecture seule (CONSULT-CLIENT) : les
  # requêtes d'écriture du scan sont refusées (403) au lieu de modifier la base dev.
  zap:
    name: ZAP (dev)
    needs: deploy
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux]
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PUBLIC_HOST: ${{ vars.VM_IP }}
      ZAP_IMAGE: zaproxy/zap-stable:2.17.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le conteneur tourne sous l'utilisateur zap (uid 1000) : le dossier des rapports
      # doit lui être accessible en écriture
      - name: Préparer le dossier des rapports
        run: |
          report_dir="$RUNNER_TEMP/zap"
          rm -rf "$report_dir" && mkdir -p "$report_dir" && chmod 777 "$report_dir"
          cp .zap/rules.tsv "$report_dir/"
          echo "ZAP_DIR=$report_dir" >> "$GITHUB_ENV"

      # host-gateway : le nom public pointe vers la VM elle-même, comme le --resolve des
      # vérifications de santé (règle Host de Traefik).
      # -I : les alertes WARN n'échouent pas le job, seules les règles FAIL de .zap/rules.tsv.
      # -j : le front est une SPA, le spider classique ne verrait que index.html. Le spider
      # Ajax explore aussi les pages construites par le JavaScript.
      # tee garde le journal de ZAP pour le résumé, pipefail garde le code de sortie de ZAP.
      - name: Scanner le front (baseline)
        run: |
          set -o pipefail
          docker run --rm \
            --add-host "${PUBLIC_HOST}:host-gateway" \
            -v "$ZAP_DIR:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py -t "https://${PUBLIC_HOST}:8443" \
              -c rules.tsv -I -j -m 5 \
              -r baseline.html -J baseline.json | tee "$ZAP_DIR/baseline.log"

      # Jeton demandé par le client enervision-zap (étape Keycloak du job deploy). Mot de
      # passe et secret passent par l'entrée standard de curl, jamais par ses arguments (ps).
      # Le jeton est masqué dans les logs et donné à ZAP par variable d'environnement.
      # Indépendant du baseline : lancé même si celui-ci a échoué
      - name: Scanner l'API (authentifié)
        if: ${{ !cancelled() }}
        env:
          ZAP_CLIENT_SECRET: ${{ secrets.DEV_ZAP_CLIENT_SECRET }}
          SEED_PASSWORD: ${{ secrets.DEV_SEED_PASSWORD }}
          ZAP_USER: consult.client@demo.test
        run: |
          if [ -z "$ZAP_CLIENT_SECRET" ] || [ -z "$SEED_PASSWORD" ]; then
            echo "::error::DEV_ZAP_CLIENT_SECRET ou DEV_SEED_PASSWORD manquant (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          reponse=$(python3 -c '
          import os, urllib.parse
          print(urllib.parse.urlencode({
              "grant_type": "password",
              "client_id": "enervision-zap",
              "client_secret": os.environ["ZAP_CLIENT_SECRET"],
              "username": os.environ["ZAP_USER"],
              "password": os.environ["SEED_PASSWORD"],
          }))' | curl -fsSk --resolve "${PUBLIC_HOST}:8443:127.0.0.1" -d @- \
                 "https://${PUBLIC_HOST}:8443/auth/realms/enervision/protocol/openid-connect/token") || {
            echo "::error::Jeton refusé par Keycloak (client enervision-zap absent, secret ou mot de passe faux)"
            exit 1
          }
          jeton=$(printf '%s' "$reponse" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$jeton"
          # L'API doit accepter le jeton, sinon le scan ne verrait que des 401 et le job
          # resterait vert. Le jeton passe par l'entrée standard de curl, jamais par ses arguments.
          code=$(printf 'Authorization: Bearer %s\n' "$jeton" | curl -sk -o /dev/null \
                 -w '%{http_code}' --resolve "${PUBLIC_HOST}:8443:127.0.0.1" -H @- \
                 "https://${PUBLIC_HOST}:8443/api/moi") || code=000
          if [ "$code" != 200 ]; then
            echo "::error::L'API refuse le jeton du scan (GET /api/moi : $code au lieu de 200). Compte consult.client@demo.test absent de l'API, ou audience enervision-api manquante au client enervision-zap ?"
            exit 1
          fi
          export ZAP_AUTH_HEADER_VALUE="Bearer $jeton"
          export ZAP_AUTH_HEADER_SITE="$PUBLIC_HOST"
          # Scan actif borné à 20 min : le jeton expire au bout de 30
          set -o pipefail
          docker run --rm \
            --add-host "${PUBLIC_HOST}:host-gateway" \
            -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE \
            -v "$ZAP_DIR:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-api-scan.py -t "https://${PUBLIC_HOST}:8443/api/openapi.json" -f openapi \
              -c rules.tsv -I \
              -z "-config scanner.maxScanDurationInMins=20" \
              -r api.html -J api.json | tee "$ZAP_DIR/api.log"

      # Résumé des alertes dans la page du job, sans ouvrir l'artefact. Les ids sont ceux à
      # écrire dans .zap/rules.tsv. Un rapport absent veut dire que ZAP n'a rien écrit.
      - name: Résumer les résultats ZAP
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os

          dossier = os.environ.get("ZAP_DIR") or os.path.join(os.environ["RUNNER_TEMP"], "zap")
          risques = {"3": "High", "2": "Medium", "1": "Low", "0": "Info"}
          resume = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")


          def ecrire(texte=""):
              print(texte, file=resume)


          ecrire("## Résultats ZAP (dev)")
          for nom, titre in (("baseline", "Front (baseline)"), ("api", "API (authentifiée)")):
              ecrire()
              ecrire(f"### {titre}")
              rapport = os.path.join(dossier, nom + ".json")
              if not os.path.exists(rapport):
                  print(f"::warning::{nom}.json absent : ZAP n'a écrit aucun rapport")
                  ecrire("Aucun rapport : ZAP n'a rien écrit, voir les logs du job.")
                  continue
              journal = os.path.join(dossier, nom + ".log")
              if os.path.exists(journal):
                  with open(journal, encoding="utf-8", errors="replace") as f:
                      lignes = [ligne.strip() for ligne in f]
                  for debut in ("Total of", "FAIL-NEW"):
                      trouvees = [ligne for ligne in lignes if ligne.startswith(debut)]
                      if trouvees:
                          ecrire(f"`{trouvees[-1]}`")
              with open(rapport, encoding="utf-8") as f:
                  sites = json.load(f).get("site", [])
              alertes = sorted(
                  (a for site in sites for a in site.get("alerts", [])),
                  key=lambda a: -int(a.get("riskcode", 0)),
              )
              if not alertes:
                  ecrire("Aucune alerte.")
                  continue
              ecrire()
              ecrire("| Id | Alerte | Risque | Instances |")
              ecrire("|---|---|---|---|")
              for a in alertes:
                  nom_alerte = (a.get("name") or a.get("alert", "")).replace("|", "/")
                  risque = risques.get(str(a.get("riskcode")), "?")
                  ecrire(f"| {a.get('pluginid')} | {nom_alerte} | {risque} | {a.get('count', '')} |")
          PY

      - name: Publier les rapports ZAP
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: |
            ${{ runner.temp }}/zap/*.html
            ${{ runner.temp }}/zap/*.json
            ${{ runner.temp }}/zap/*.log
          if-no-files-found: warn

  # GHCR est gratuit « pour l'instant » : on ne garde que les 20 dernières versions de
  # chaque image. Les versions sont communes à dev et prod : la purge ne tourne donc
  # qu'au déploiement de prod, dont la version vient d'être publiée et reste la plus
  # récente. Une purge lancée par dev pourrait sinon supprimer la version qui tourne en
  # prod. Après le déploiement, qui ne l'attend pas ; une seule définition pour toutes
  # les images (matrice). Un échec n'a aucun effet sur l'application.
  purge:
    name: Purger les anciennes versions (${{ matrix.image }})
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: write
    strategy:
      matrix:
        image: [api, etl, front, model, backup]
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: enervision-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 20
