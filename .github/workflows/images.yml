name: Images

# Construit api, etl, front, model et backup une seule fois, teste la stack de prod complète avec ces
# images (Traefik + compose-prod.yml, scripts db/ compris), les scanne avec Trivy, puis,
# appelé par deploy.yml avec push: true, les publie sur GHCR taguées par le SHA du commit.
# La VM déploie ensuite exactement ces images (docker compose pull), sans les reconstruire.

on:
  pull_request:
    branches: [develop, main]
  # Appelé par deploy.yml : rien n'est déployé sans ces contrôles
  workflow_call:
    inputs:
      push:
        description: Publier les images sur GHCR une fois les contrôles réussis
        type: boolean
        default: false

# Nom de groupe fixe : voir pre-commit.yml
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: Build, test et scan des images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Publication et purge des images sur GHCR (étapes limitées à push: true)
      packages: write
    env:
      # Stack de test : environnement dev (Traefik sur 8443), mots de passe jetables
      DEPLOY_ENV: dev
      POSTGRES_USER: enervision
      # Nom différent de « enervision » : rien ne doit supposer le nom de la base (la
      # sauvegarde lit POSTGRES_DB, comme sur la VM où chaque environnement a le sien)
      POSTGRES_DB: enervision_ci
      POSTGRES_PASSWORD: ci-postgres
      ETL_DB_PASSWORD: ci-etl
      MODEL_DB_PASSWORD: ci-model
      API_DB_PASSWORD: ci-api
      BACKUP_DB_PASSWORD: ci-backup
      KEYCLOAK_ADMIN: ci-admin
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-admin
      KEYCLOAK_DB_PASSWORD: ci-keycloak
      KEYCLOAK_ADMIN_CLIENT_SECRET: ci-keycloak-client
      # Comptes de démonstration créés par l'API à son démarrage (api/seed.py)
      SEED_PASSWORD: ci-comptes-demo-mot-de-passe
      # Sauvegarde : testée dans un dépôt local du conteneur, pas sur Azure
      RESTIC_PASSWORD: ci-restic
      GRAFANA_ADMIN_PASSWORD: ci-grafana
      MONITORING_DB_PASSWORD: ci-monitoring
      FRONT_URL: https://localhost:8443
      # Nom d'hôte accepté par les routes Traefik (IP de la VM en déploiement)
      PUBLIC_HOST: localhost
      # Schemathesis lit le contrat sur /api/openapi.json (masqué par défaut dans compose-prod.yml)
      API_DOCS_ENABLED: "true"
    steps:
      # Pas de jeton dans .git/config : le job a packages: write et exécute le code de la PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Noms des images, identiques à ceux calculés par deploy.yml (GHCR exige des minuscules)
      - name: Noms des images
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Les cibles et les tags viennent de compose-prod.yml. Cache de build dans le cache
      # GitHub Actions (10 Go gratuits) : seules les couches modifiées sont reconstruites.
      - name: Construire les images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose-prod.yml
          targets: api,etl,front,dataset,backup
          load: true
          set: |
            *.pull=true
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            etl.cache-from=type=gha,scope=etl
            etl.cache-to=type=gha,scope=etl,mode=max
            front.cache-from=type=gha,scope=front
            front.cache-to=type=gha,scope=front,mode=max
            dataset.cache-from=type=gha,scope=model
            dataset.cache-to=type=gha,scope=model,mode=max
            backup.cache-from=type=gha,scope=backup
            backup.cache-to=type=gha,scope=backup,mode=max
            front.args.MAJ_SECURITE=${{ github.run_id }}-${{ github.run_attempt }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true

      # Scans lancés en tâche de fond : ils tournent pendant le démarrage et les tests de la
      # stack, et leur résultat est lu à l'étape « Résultat des scans Trivy ». Les images sont
      # scannées l'une après l'autre : deux processus Trivy ne peuvent pas partager le cache.
      # --ignore-unfixed : on ne bloque que sur ce qui a un correctif disponible.
      - name: Lancer les scans Trivy (en tâche de fond)
        run: |
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          echo "TRIVY_DIR=$dir" >> "$GITHUB_ENV"
          (
            failed=""
            for service in api etl front model backup; do
              trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
                --format table --ignorefile .trivyignore --skip-version-check \
                "$IMAGE_REPO/enervision-$service:$IMAGE_TAG" > "$dir/$service.log" 2>&1 \
                || failed="$failed $service"
            done
            echo "$failed" > "$dir/failed"
          ) > "$dir/background.log" 2>&1 &

      # Même enchaînement que sur la VM : Traefik partagé, puis la stack sans rebuild
      - name: Démarrer la stack
        run: |
          cert_dir="$RUNNER_TEMP/certs"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$cert_dir/key.pem" -out "$cert_dir/cert.pem" 2>/dev/null
          echo "TLS_CERT_DIR=$cert_dir" >> "$GITHUB_ENV"
          TLS_CERT_DIR="$cert_dir" docker compose -f infra/traefik/compose.yml up -d --wait
          docker compose -f compose-prod.yml up -d --no-build --wait --wait-timeout 180

      - name: Tester la stack
        run: |
          base="https://localhost:8443"
          # API via Traefik ; /api/health vérifie aussi la connexion à la base (compte api)
          for _ in $(seq 1 30); do
            curl -fsSk "$base/api/health" >/dev/null && break
            sleep 2
          done
          curl -fsSk "$base/api/health"
          echo
          # Front servi par nginx via Traefik
          curl -fsSk "$base/" | grep -q '<div id="app"'
          # HTTP redirige vers HTTPS
          redirect=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/)
          [ "$redirect" = "$base/" ] || { echo "::error::Redirection HTTP inattendue : '$redirect'"; exit 1; }
          # Slash final : 404 de l'API, sans redirection (redirect_slashes=False)
          result=$(curl -sk -o /dev/null -w '%{http_code} %header{location}' "$base/api/health/")
          [ "$result" = "404 " ] || { echo "::error::Réponse inattendue sur /api/health/ : '$result'"; exit 1; }
          # Redirection de nginx (dossier) : relative, donc reste en HTTPS
          location=$(curl -sk -o /dev/null -w '%header{location}' "$base/assets")
          [ "$location" = "/assets/" ] || { echo "::error::Redirection de nginx inattendue : '$location'"; exit 1; }
          # Autre nom d'hôte : 404 de Traefik, sans redirection vers cet hôte, en HTTPS
          # comme en HTTP (infra/traefik/dynamic/redirections.yml)
          for url in "$base/api/health/" "$base/assets" "$base/" http://localhost:8080/; do
            result=$(curl -sk -o /dev/null -w '%{http_code} %header{location}' -H "Host: evil.example" "$url")
            [ "$result" = "404 " ] || { echo "::error::Host: evil.example accepté sur $url : '$result'"; exit 1; }
          done
          # En-têtes de sécurité (infra/traefik/dynamic/middlewares.yml) et leur valeur, sans version
          # dans Server. Chaque attendu est le début de la ligne d'en-tête.
          check_headers() {
            local path=$1
            headers=$(curl -sk -o /dev/null -D - "$base$path" | tr -d '\r')
            shift
            for expected in "X-Content-Type-Options: nosniff" \
                            "Referrer-Policy: strict-origin-when-cross-origin" "$@"; do
              grep -qi "^$expected" <<< "$headers" \
                || { echo "::error::$expected attendu sur $path"; echo "$headers"; exit 1; }
            done
            if grep -qiE '^Server:.*[0-9]' <<< "$headers"; then
              echo "::error::Version du serveur exposée"; echo "$headers"; exit 1
            fi
          }
          check_headers /api/health "X-Frame-Options: DENY"
          check_headers / "X-Frame-Options: DENY" "Content-Security-Policy: default-src 'self';"
          check_headers /page-inexistante "X-Frame-Options: DENY" "Content-Security-Policy: default-src 'self';"
          check_headers /auth/realms/enervision
          # Ce contrôle ne charge pas la page dans un navigateur : il vérifie la CSP du front
          # telle qu'écrite. Styles en ligne autorisés (attributs style, feuille du toaster),
          # scripts laissés sur default-src 'self'
          csp=$(curl -sk -o /dev/null -D - "$base/" | tr -d '\r' | grep -i '^Content-Security-Policy:')
          grep -qE "style-src[^;]*'unsafe-inline'" <<< "$csp" \
            || { echo "::error::style-src sans 'unsafe-inline' : styles en ligne du front refusés"; echo "$csp"; exit 1; }
          if grep -q "script-src" <<< "$csp"; then
            echo "::error::script-src défini : les scripts doivent rester sur default-src 'self'"; echo "$csp"; exit 1
          fi
          # Aucun script en ligne dans la page, et chaque script qu'elle charge vient de la
          # même origine
          page=$(curl -fsSk "$base/")
          inline=$(grep -oiE '<script[^>]*>' <<< "$page" | grep -viE '[[:space:]]src=' || true)
          [ -z "$inline" ] || { echo "::error::Script en ligne refusé par la CSP : $inline"; exit 1; }
          for src in $(grep -oiE '<script[^>]*[[:space:]]src="[^"]+"' <<< "$page" | sed -E 's/.*src="([^"]+)"/\1/'); do
            [[ "$src" == /* && "$src" != //* ]] || { echo "::error::Script hors de l'origine : $src"; exit 1; }
            curl -fsSk -o /dev/null "$base$src" || { echo "::error::Script introuvable : $src"; exit 1; }
          done
          # Keycloak via Traefik : émetteur des jetons = adresse publique, identique pour
          # le navigateur et pour l'API (réseau interne)
          expected="$base/auth/realms/enervision"
          issuer=$(curl -fsSk "$expected/.well-known/openid-configuration" | jq -r .issuer)
          [ "$issuer" = "$expected" ] || { echo "::error::Émetteur Keycloak inattendu : '$issuer'"; exit 1; }
          # Même adresse interne que l'API (KEYCLOAK_URL_INTERNE de compose-prod.yml)
          internal=$(docker compose -f compose-prod.yml exec -T api python -c \
            "import json, os, urllib.request; print(json.load(urllib.request.urlopen(os.environ['KEYCLOAK_URL_INTERNE'] + '/realms/enervision/.well-known/openid-configuration'))['issuer'])")
          [ "$internal" = "$expected" ] || { echo "::error::Émetteur vu par l'API : '$internal'"; exit 1; }
          # Console d'administration et realm master servis par Keycloak, pas par le front
          master=$(curl -fsSk "$base/auth/realms/master/.well-known/openid-configuration" | jq -r .issuer)
          [ "$master" = "$base/auth/realms/master" ] \
            || { echo "::error::Realm master non routé vers Keycloak : '$master'"; exit 1; }
          curl -fsSkL "$base/auth/admin/master/console/" | grep -q '<title>Keycloak Administration Console' \
            || { echo "::error::/auth/admin n'est pas routé vers la console Keycloak"; exit 1; }
          # Scripts db/ : chaque compte de service se connecte avec son mot de passe.
          # -h db (réseau Docker) et non 127.0.0.1, où l'image postgres ne demande aucun
          # mot de passe (trust dans pg_hba.conf) : le test ne prouverait rien.
          login() {
            docker compose -f compose-prod.yml exec -T -e PGPASSWORD="$2" db \
              psql -h db -U "$1" -d "${3:-$POSTGRES_DB}" -tAc 'SELECT 1' >/dev/null
          }
          login etl "$ETL_DB_PASSWORD"
          login model "$MODEL_DB_PASSWORD"
          login backup "$BACKUP_DB_PASSWORD"
          # Base keycloak (09_keycloak.sh) : son compte, et backup pour la sauvegarde
          login keycloak "$KEYCLOAK_DB_PASSWORD" keycloak
          login backup "$BACKUP_DB_PASSWORD" keycloak
          if login api "mauvais-mot-de-passe" 2>/dev/null; then
            echo "::error::Le compte api accepte un mauvais mot de passe"
            exit 1
          fi
          # ETL : planning valide et conteneur toujours démarré
          docker compose -f compose-prod.yml exec -T etl supercronic -test etl/crontab
          [ -n "$(docker compose -f compose-prod.yml ps etl --status running -q)" ] \
            || { echo "::error::Le conteneur etl n'est pas démarré"; exit 1; }
          # Prévisions : planning valide et conteneur toujours démarré. Sans modèle en
          # production (MLflow vide en CI), un lancement prévient et n'écrit rien
          docker compose -f compose-prod.yml exec -T prevision supercronic -test model/crontab
          [ -n "$(docker compose -f compose-prod.yml ps prevision --status running -q)" ] \
            || { echo "::error::Le conteneur prevision n'est pas démarré"; exit 1; }
          docker compose -f compose-prod.yml exec -T prevision python -m model.prevision
          # Sauvegarde : planning valide, puis une sauvegarde complète dans un dépôt local
          # du conteneur (le compte backup doit pouvoir lire les bases enervision et keycloak)
          docker compose -f compose-prod.yml exec -T backup supercronic -test /app/crontab
          # Environnement ci : hors de dev et prod, le script accepte un dépôt local (/tmp du
          # conteneur). Mode hebdo : prune et restic check sont testés aussi.
          docker compose -f compose-prod.yml exec -T -e DEPLOY_ENV=ci -e RESTIC_REPOSITORY=/tmp/repo \
            backup /app/backup.sh hebdo
          snapshots=$(docker compose -f compose-prod.yml exec -T -e RESTIC_REPOSITORY=/tmp/repo backup \
            restic snapshots --json | jq -r '[.[].tags[]] | sort | join(" ")')
          [ "$snapshots" = "$POSTGRES_DB keycloak" ] \
            || { echo "::error::Snapshots inattendus : '$snapshots'"; exit 1; }
          # Garde-fou de backup.sh, dans la configuration de la VM (DEPLOY_ENV=dev). Sans
          # compte Azure en CI, backup.sh échoue toujours : on vérifie qu'il échoue à la
          # bonne étape, d'après son message.
          echec_attendu() {
            message=$1
            shift
            if output=$(docker compose -f compose-prod.yml exec -T "$@" backup /app/backup.sh 2>&1); then
              echo "::error::backup.sh aurait dû échouer ($*)"
              exit 1
            fi
            echo "$output" | grep -qF "$message" \
              || { echo "::error::Échec à une autre étape que prévu ($*) : $output"; exit 1; }
          }
          # Refusés par le garde-fou : tout dépôt autre que azure:restic-dev:/
          echec_attendu "Dépôt restic refusé" -e RESTIC_REPOSITORY=/tmp/repo
          echec_attendu "Dépôt restic refusé" -e RESTIC_REPOSITORY=azure:restic-prod:/
          echec_attendu "DEPLOY_ENV manquant" -e DEPLOY_ENV=
          # Accepté : le dépôt de compose-prod.yml (azure:restic-dev:/) passe le garde-fou,
          # et la sauvegarde ne s'arrête qu'à l'ouverture du dépôt, faute de compte Azure
          # (aucune requête réseau). Un motif trop strict bloquerait sinon toutes les nuits.
          # Message de backup.sh, écrit seulement après le garde-fou : une nouvelle version
          # de restic qui reformule ses erreurs ne fait pas échouer ce test.
          echec_attendu "Dépôt restic injoignable" -e AZURE_ACCOUNT_NAME=

      # Job du jeu d'entraînement (profil jobs), sur un petit CSV généré : image du modèle,
      # montage des données brutes et enregistrement dans le MLflow de la stack
      - name: Tester le job du jeu d'entraînement
        run: |
          raw="$RUNNER_TEMP/dataset-raw"
          mkdir -p "$raw"
          python3 - "$raw" <<'PY'
          import csv, json, sys
          from datetime import datetime, timedelta
          raw = sys.argv[1]
          start = datetime(2023, 1, 1)
          with open(f"{raw}/all_sites_combined.csv", "w", newline="") as f:
              out = csv.writer(f)
              out.writerow(["timestamp", "site_id", "consumption_kwh"])
              for site in ("SITE001", "SITE002"):
                  for h in range(48):
                      value = "" if h == 10 else 100 + h
                      out.writerow([(start + timedelta(hours=h)).isoformat(" "), site, value])
          meta = {"site_id": "SITE001", "anomalies": [
              {"timestamp": "2023-01-01T05:00:00", "type": "spike", "severity": "high"}]}
          with open(f"{raw}/SITE001_metadata.json", "w") as f:
              json.dump(meta, f)
          PY
          DATASET_RAW_DIR="$raw" docker compose -f compose-prod.yml run --rm --pull never \
            dataset 2>&1 | tee "$RUNNER_TEMP/dataset.log"
          grep -q "jeu enregistré dans MLflow" "$RUNNER_TEMP/dataset.log" \
            || { echo "::error::Le jeu n'a pas été enregistré dans MLflow"; exit 1; }
          docker compose -f compose-prod.yml exec -T mlflow python -c \
            "import urllib.request; urllib.request.urlopen('http://localhost:5000/mlflow/api/2.0/mlflow/experiments/get-by-name?experiment_name=jeu-entrainement')"

      # Même migration que deploy.yml. Les scripts de db/ ont déjà tourné à la création de
      # la base : ce second passage échoue si l'un d'eux ne peut pas être rejoué sur une
      # base existante. Les tests SQL qui suivent portent donc sur une base migrée.
      - name: Rejouer la migration de la base
        run: docker compose -f compose-prod.yml exec -T db bash /docker-entrypoint-initdb.d/tools/migrate.sh

      # Tests SQL de db/tests/ (droits des comptes, actions du dashboard), sur la base
      # créée par les scripts d'initialisation de la stack. Lancés en superutilisateur :
      # chaque script prend lui-même les droits d'un compte (SET ROLE) et annule tout (ROLLBACK).
      - name: Tests SQL
        run: |
          for f in db/tests/*.sql; do
            echo "::group::$f"
            docker compose -f compose-prod.yml exec -T db \
              psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" < "$f"
            echo "::endgroup::"
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Jeton Keycloak pour tester les routes protégées. Sur cette stack jetable seulement :
      # connexion par mot de passe ouverte sur enervision-front (fermée dans le realm), et
      # compte de test administrateur EnerVision (sans client : voit toutes les données).
      - name: Compte de test et jeton Keycloak
        env:
          CI_TEST_PASSWORD: ci-schemathesis-mot-de-passe
          # Le realm prend l'e-mail comme identifiant (registrationEmailAsUsername) :
          # on se connecte avec l'e-mail, pas avec un nom d'utilisateur
          CI_TEST_EMAIL: ci-schemathesis@example.test
        run: |
          kcadm() {
            docker compose -f compose-prod.yml exec -T -e KC_CLI_PASSWORD keycloak \
              /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm-ci.config
          }
          KC_CLI_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" kcadm config credentials \
            --server http://localhost:8080/auth --realm master --user "$KEYCLOAK_ADMIN"
          id_front=$(kcadm get clients -r enervision -q clientId=enervision-front \
            --fields id --format csv --noquotes)
          kcadm update "clients/$id_front" -r enervision -s directAccessGrantsEnabled=true
          # Jeton valable 30 min : le temps de toute la campagne Schemathesis
          kcadm update realms/enervision -s accessTokenLifespan=1800
          id_user=$(kcadm create users -r enervision -i -s "email=$CI_TEST_EMAIL" \
            -s firstName=CI -s lastName=Schemathesis \
            -s enabled=true -s emailVerified=true)
          KC_CLI_PASSWORD="$CI_TEST_PASSWORD" kcadm set-password -r enervision --userid "$id_user"
          kcadm add-roles -r enervision --uid "$id_user" --rolename GESTION-CLIENT
          docker compose -f compose-prod.yml exec -T db \
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "INSERT INTO app.utilisateur (id) VALUES ('$id_user')"

          # Sans -f : en cas de refus, on affiche la raison donnée par Keycloak
          reponse=$(curl -sSk https://localhost:8443/auth/realms/enervision/protocol/openid-connect/token \
            -d grant_type=password -d client_id=enervision-front \
            --data-urlencode "username=$CI_TEST_EMAIL" \
            --data-urlencode "password=$CI_TEST_PASSWORD")
          token=$(jq -r '.access_token // empty' <<<"$reponse")
          [ -n "$token" ] || {
            echo "::error::Pas de jeton Keycloak : $(jq -r '.error_description // .error // .' <<<"$reponse")"
            exit 1
          }
          echo "::add-mask::$token"
          echo "API_TOKEN=$token" >> "$GITHUB_ENV"

          # Chaîne complète : jeton émis par Keycloak (adresse publique), vérifié par l'API
          # avec les clés lues en interne, compte retrouvé dans app.utilisateur
          url="https://localhost:8443/api/sites/derniere-mesure"
          code=$(curl -sk -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = 401 ] || { echo "::error::Sans jeton : $code au lieu de 401"; exit 1; }
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$url")
          [ "$code" = 200 ] || { echo "::error::Avec jeton : $code au lieu de 200"; exit 1; }

      # Seeding au démarrage de l'API : le compte consult.site@demo.test se connecte, est
      # enregistré en base (GET /api/moi) et ne voit que son site (rôle CONSULT-SITE)
      - name: Comptes de démonstration
        run: |
          reponse=""
          for _ in $(seq 1 30); do
            reponse=$(curl -sSk https://localhost:8443/auth/realms/enervision/protocol/openid-connect/token \
              -d grant_type=password -d client_id=enervision-front \
              -d username=consult.site@demo.test --data-urlencode "password=$SEED_PASSWORD")
            jq -e .access_token <<<"$reponse" >/dev/null && break
            sleep 2
          done
          token=$(jq -r '.access_token // empty' <<<"$reponse")
          [ -n "$token" ] || {
            echo "::error::Compte de démonstration absent de Keycloak après 60 s"
            docker compose -f compose-prod.yml logs api | grep -i seed
            exit 1
          }
          echo "::add-mask::$token"
          curl -fsSk -H "Authorization: Bearer $token" https://localhost:8443/api/moi \
            | jq -e '.roles == ["CONSULT-SITE"]' >/dev/null \
            || { echo "::error::consult.site non enregistré en base ou mauvais rôle"; exit 1; }
          # Une mesure pour SITE001 (son site) et SITE002 (pas le sien), sans attendre l'ETL
          docker compose -f compose-prod.yml exec -T db \
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              INSERT INTO gold.derniere_mesure (id_site, horodatage, consommation_kw, data_quality)
              VALUES ('SITE001', now(), 100, 'good'), ('SITE002', now(), 200, 'good')
              ON CONFLICT (id_site) DO NOTHING"
          sites=$(curl -fsSk -H "Authorization: Bearer $token" https://localhost:8443/api/sites/derniere-mesure \
            | jq -r '[.[].id_site] | unique | join(",")')
          [ "$sites" = SITE001 ] \
            || { echo "::error::consult.site doit voir SITE001 seulement, pas '$sites'"; exit 1; }

      # Actions du dashboard (US7) avec les comptes de démonstration : un rôle de
      # consultation ne peut pas agir, GESTION-SITE agit sur ses sites (SITE002) et ne voit
      # pas les autres, une deuxième prise en compte est refusée
      - name: Actions du dashboard
        run: |
          jeton() {
            curl -fsSk https://localhost:8443/auth/realms/enervision/protocol/openid-connect/token \
              -d grant_type=password -d client_id=enervision-front \
              -d "username=$1" --data-urlencode "password=$SEED_PASSWORD" | jq -r .access_token
          }
          consult=$(jeton consult.site@demo.test)
          gestion=$(jeton gestion.site@demo.test)
          echo "::add-mask::$consult"
          echo "::add-mask::$gestion"
          ids=$(docker compose -f compose-prod.yml exec -T db \
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -qtA -c "
              INSERT INTO gold.alerte (id_site, source, type, severite, debut, valeur, seuil)
              VALUES ('SITE001', 'etl', 'threshold', 'high', now(), 752, 720),
                     ('SITE002', 'etl', 'threshold', 'high', now(), 752, 720)
              RETURNING id_alerte" | tr -d '\r' | paste -sd ' ')
          read -r alerte_site001 alerte_site002 <<<"$ids"
          ids=$(docker compose -f compose-prod.yml exec -T db \
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -qtA -c "
              INSERT INTO gold.recommandation (id_site, regle, titre)
              VALUES ('SITE001', 'ci', 'Décaler la production'),
                     ('SITE002', 'ci', 'Décaler la production')
              RETURNING id_recommandation" | tr -d '\r' | paste -sd ' ')
          read -r reco_site001 reco_site002 <<<"$ids"

          verifier() {
            local attendu=$1 jeton=$2 chemin=$3 corps=${4:-}
            code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $jeton" -H 'Content-Type: application/json' \
              ${corps:+-d "$corps"} "https://localhost:8443/api$chemin")
            [ "$code" = "$attendu" ] \
              || { echo "::error::POST $chemin : $code au lieu de $attendu"; exit 1; }
          }
          verifier 403 "$consult" "/alertes/$alerte_site001/prise-en-compte"
          verifier 404 "$gestion" "/alertes/$alerte_site001/prise-en-compte"
          verifier 200 "$gestion" "/alertes/$alerte_site002/prise-en-compte"
          verifier 409 "$gestion" "/alertes/$alerte_site002/prise-en-compte"
          verifier 403 "$consult" "/recommandations/$reco_site001/decision" '{"statut":"acceptee"}'
          verifier 200 "$gestion" "/recommandations/$reco_site002/decision" '{"statut":"acceptee"}'
          verifier 409 "$gestion" "/recommandations/$reco_site002/decision" '{"statut":"refusee"}'

      # Contrat OpenAPI vérifié sur le conteneur de l'API, derrière Traefik, avec le jeton
      # du compte de test : les routes protégées sont testées au-delà du 401
      # 4.30.1 au moins : faux positif negative_data_rejection corrigé (paramètre inconnu
      # vidé à l'envoi, à côté d'une valeur comme id_site=0 : la requête reçue était valide)
      - name: Contrat d'API (Schemathesis)
        run: |
          pip install schemathesis==4.31.1
          schemathesis run https://localhost:8443/api/openapi.json --checks all --tls-verify false \
            --header "Authorization: Bearer $API_TOKEN"

      - name: Logs de la stack
        if: failure()
        run: |
          docker compose -f compose-prod.yml ps -a
          docker compose -f compose-prod.yml logs --tail=100
          docker compose -f infra/traefik/compose.yml logs --tail=50

      # Attend la fin des scans lancés en tâche de fond, affiche leurs rapports et bloque
      # si une image contient une vulnérabilité HIGH ou CRITICAL corrigeable. Affiché même
      # si les tests ont échoué, dès que les scans ont été lancés.
      - name: Résultat des scans Trivy
        if: always() && env.TRIVY_DIR != ''
        run: |
          for _ in $(seq 1 300); do
            [ -f "$TRIVY_DIR/failed" ] && break
            sleep 1
          done
          if [ ! -f "$TRIVY_DIR/failed" ]; then
            cat "$TRIVY_DIR/background.log"
            echo "::error::Les scans Trivy n'ont pas fini en 5 minutes"
            exit 1
          fi
          for service in api etl front model backup; do
            echo "::group::Trivy - $service"
            cat "$TRIVY_DIR/$service.log"
            echo "::endgroup::"
          done
          failed=$(cat "$TRIVY_DIR/failed")
          if [ -n "$failed" ]; then
            echo "::error::Vulnérabilité HIGH ou CRITICAL corrigeable dans :$failed (rapports ci-dessus)"
            exit 1
          fi

      # Les images publiées sont celles qui viennent d'être testées et scannées
      - name: Publier sur GHCR
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose -f compose-prod.yml push api etl front dataset backup
