name: Security Scan

on:
  pull_request:
    branches: [develop, main]
  # Appelé par deploy.yml : rien n'est déployé sans ce scan
  workflow_call:

# Nom de groupe fixe : voir pre-commit.yml
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy - Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Même version que images.yml (la valeur par défaut de l'action est plus ancienne)
          version: "v0.76.1"
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          trivyignores: ".trivyignore"

      # Le scan fs ne cherche que vulnérabilités et secrets : la configuration
      # Terraform (stockage Azure) a son propre scan
      - name: Trivy - Scan Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.1"
          scan-type: "config"
          scan-ref: "infra/terraform"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"

  # Les images Docker sont construites, testées et scannées par images.yml
