name: Security Scan

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy - Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          trivyignores: ".trivyignore"

  # Construit chaque image (un Dockerfile cassé bloque la PR), puis la scanne.
  # --ignore-unfixed : on ne bloque que sur ce qui a un correctif disponible.
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: etl
            context: .
            dockerfile: etl/Dockerfile
          - name: front
            context: front
            dockerfile: front/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: >
          docker build --pull
          -t enervision-${{ matrix.name }}:ci
          -f ${{ matrix.dockerfile }}
          --build-arg VITE_API_URL=/api
          ${{ matrix.context }}

      - name: Trivy - Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "enervision-${{ matrix.name }}:ci"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          format: "table"
          trivyignores: ".trivyignore"
