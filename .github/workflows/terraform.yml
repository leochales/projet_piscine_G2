name: Terraform

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, validité et lint du code Terraform. Aucun accès à Azure :
  # le plan et l'apply se font depuis un poste (infra/terraform/README.md)
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false : pas besoin du compte d'état pour valider
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.65.0"

      - name: tflint
        run: |
          tflint --init
          tflint -f compact
        env:
          # Téléchargement du plugin azurerm sans limite de débit anonyme
          GITHUB_TOKEN: ${{ github.token }}
