name: pre-commit

on:
  # PR des branches de feature vers develop (et de develop vers main)
  pull_request:
    branches: [develop, main]
  # Appelé par deploy.yml : rien n'est déployé sans ces vérifications
  workflow_call:

# Annule l'exécution précédente si un nouveau push arrive sur la même PR.
# Nom de groupe fixe : appelé par deploy.yml, github.workflow vaudrait « Deploy »
# et ce groupe se confondrait avec celui de security.yml (annulation mutuelle).
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

# no-commit-to-branch échouerait à chaque push après merge sur develop / main
env:
  SKIP: no-commit-to-branch

jobs:
  # Mêmes vérifications qu'au commit (lint, format, SQL, Dockerfile)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Étapes Node ignorées tant que front/package-lock.json n'existe pas
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('front/package-lock.json') != ''
        with:
          node-version: "24"
          # Dernier correctif de sécurité, pas la version en cache sur le runner
          check-latest: true
          cache: npm
          cache-dependency-path: front/package-lock.json

      # Nécessaire pour les hooks locaux prettier / eslint du front
      - name: Install front dependencies
        if: hashFiles('front/package-lock.json') != ''
        run: npm ci
        working-directory: front

      # Lance tous les hooks du stage pre-commit, avec cache intégré
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # Mêmes vérifications qu'au push : tests avec seuil de couverture (80 %) et typage
  tests:
    runs-on: ubuntu-latest
    env:
      SKIP: trivy-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('front/package-lock.json') != ''
        with:
          node-version: "24"
          # Dernier correctif de sécurité, pas la version en cache sur le runner
          check-latest: true
          cache: npm
          cache-dependency-path: front/package-lock.json

      # Adapter aux fichiers de dépendances réels de chaque service
      - name: Install Python dependencies
        run: |
          pip install pre-commit==4.7.0 pytest mypy
          for svc in common api model etl; do
            if [ -f "$svc/requirements.txt" ]; then pip install -r "$svc/requirements.txt"; fi
            if [ -f "$svc/requirements-dev.txt" ]; then pip install -r "$svc/requirements-dev.txt"; fi
          done

      - name: Install front dependencies
        if: hashFiles('front/package-lock.json') != ''
        run: npm ci
        working-directory: front

      - name: Run pre-push hooks
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

      # Couverture affichée dans le résumé du workflow, même si les tests échouent
      # (--fail-under=0 : le seuil est déjà vérifié par les hooks, ici on ne fait qu'afficher)
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Couverture des tests (seuil : 80 %)"
            echo "### Back : api + common"
            if [ -f .coverage ]; then
              python -m coverage report --format=markdown --fail-under=0
            else
              echo "Pas de données (tests Python non lancés)."
            fi
            echo "### Front : stores, lib, services"
            python infra/ci/coverage_summary.py front/coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f .coverage ]; then
            python -m coverage html --fail-under=0 -d coverage-html/back
          fi

      # Rapports HTML détaillés (lignes non couvertes en couleur), à télécharger
      # depuis la page du workflow, rubrique « Artifacts »
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage-html/back
            front/coverage
          if-no-files-found: ignore
          retention-days: 14
