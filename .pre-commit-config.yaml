default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------
  # Hooks généraux (tous les dossiers)
  # ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # stages explicite : ces hooks déclarent aussi pre-push, ce qui
      # l'emporte sur default_stages
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: detect-private-key
      # Interdit les commits directs sur develop et main (passer par une PR)
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]

  # Secrets (mots de passe, clés d'API, jetons) dans les fichiers commités
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------
  # Python : api/, model/, etl/, common/
  # ---------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------
  # SQL : db/
  # ---------------------------------------------------------------
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 0348222a3bcdb0226563f7349c5a39beb0641955  # frozen: 4.4.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, postgres]
        files: ^db/.*\.sql$

  # ---------------------------------------------------------------
  # Docker : infra/ (et Dockerfiles dans les services)
  # ---------------------------------------------------------------
  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # frozen: v2.15.1
    hooks:
      - id: hadolint
        files: (^|/)Dockerfile[^/]*$

  # ---------------------------------------------------------------
  # Hooks locaux : outils du venv (Python) et scripts npm du front.
  # Pas de bash : fonctionne aussi sous Windows.
  # ---------------------------------------------------------------
  - repo: local
    hooks:
      # Front Vue 3 : scripts définis dans front/package.json
      # (générés par "npm create vue" : lint, format, type-check, test:unit)
      - id: front-lint
        name: eslint (front)
        entry: npm --prefix front run lint
        language: system
        files: ^front/.*\.(vue|js|ts)$
        pass_filenames: false

      - id: front-format
        name: prettier (front)
        entry: npm --prefix front run format
        language: system
        files: ^front/.*\.(vue|js|ts|json|css|scss|md)$
        pass_filenames: false

      # --- Avant le push : tests et typage ---
      # run_in_venv.py trouve le .venv tout seul : pas besoin de l'activer
      # Tests de api/ et common/, avec un minimum de 80 % de couverture (pyproject.toml)
      - id: pytest-api
        name: pytest (api + common, couverture)
        entry: python infra/pre-commit/run_in_venv.py -m pytest -q api common --cov=api --cov=common
        language: python
        files: ^(api|common)/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-model
        name: pytest (model)
        entry: python infra/pre-commit/run_in_venv.py -m pytest -q model
        language: python
        files: ^(model|common)/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-etl
        name: pytest (etl)
        entry: python infra/pre-commit/run_in_venv.py -m pytest -q etl
        language: python
        files: ^(etl|common)/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      # Fichiers passés un par un : "mypy api common" échoue
      # si l'un des dossiers ne contient encore aucun .py
      - id: mypy-api
        name: mypy (api + common)
        entry: python infra/pre-commit/run_in_venv.py -m mypy
        language: python
        files: ^(api|common)/.*\.py$
        # Un seul processus : en parallèle, les mypy se partagent .mypy_cache
        # et plantent au hasard (INTERNAL ERROR)
        require_serial: true
        stages: [pre-push]

      - id: front-type-check
        name: vue-tsc (front)
        entry: npm --prefix front run type-check
        language: system
        files: ^front/.*\.(vue|ts)$
        pass_filenames: false
        stages: [pre-push]

      - id: front-test
        name: vitest (front, couverture)
        # Seuil de 80 % sur stores, lib et services : voir front/vitest.config.ts
        entry: npm --prefix front run test:unit -- --run --coverage
        language: system
        files: ^front/.*\.(vue|js|ts)$
        pass_filenames: false
        stages: [pre-push]

      - id: trivy-scan
        name: trivy (security scan)
        # .venv et node_modules ignorés : les dépendances sont déjà analysées via
        # requirements*.txt et package-lock.json (scan en 0,3 s au lieu de ~10 s)
        entry: trivy fs --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .venv --skip-dirs front/node_modules .
        language: system
        pass_filenames: false
        stages: [pre-push]
