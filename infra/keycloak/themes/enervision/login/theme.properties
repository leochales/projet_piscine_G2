# Thème de connexion EnerVision : mêmes couleurs, rayons et police que le front (shadcn-vue).
# Hérite du thème « keycloak » (pages, scripts, messages) ; seuls template.ftl, login.ftl
# et la feuille de style sont remplacés. Les classes ci-dessous (kc*) sont celles que les
# autres pages (mot de passe oublié, erreur, mise à jour du mot de passe...) utilisent :
# elles pointent vers les classes ev-* de css/enervision.css, sans PatternFly.
parent=keycloak
import=common/keycloak

# Pas de PatternFly : seule la feuille de style d'EnerVision est chargée
stylesCommon=
styles=css/enervision.css

meta=viewport==width=device-width,initial-scale=1

locales=fr,en

kcHtmlClass=
kcBodyClass=ev-page
kcLoginClass=ev-shell
kcHeaderClass=ev-brand
kcHeaderWrapperClass=
kcFormCardClass=ev-card
kcFormHeaderClass=ev-card-header
kcContentWrapperClass=
kcFeedbackAreaClass=
kcLocaleClass=

## Formulaires
kcFormClass=ev-form
kcFormGroupClass=ev-field
kcFormGroupErrorClass=ev-field-error
kcFormGroupHeader=ev-field
kcLabelClass=ev-label
kcLabelWrapperClass=
kcInputClass=ev-input
kcInputWrapperClass=
kcInputGroup=ev-input-group
kcInputErrorMessageClass=ev-field-message
kcInputHelperTextBeforeClass=ev-field-help
kcInputHelperTextAfterClass=ev-field-help
kcInputLargeClass=
kcTextareaClass=ev-input ev-textarea
kcFormOptionsClass=
kcFormOptionsWrapperClass=ev-form-options
kcFormButtonsClass=ev-form-buttons
kcFormSettingClass=ev-form-settings
kcSignUpClass=ev-card-info
kcInfoAreaClass=
kcInfoAreaWrapperClass=

kcInputClassCheckbox=ev-check
kcInputClassCheckboxInput=ev-checkbox
kcInputClassCheckboxLabel=ev-check-label
kcInputClassRadio=ev-check
kcInputClassRadioInput=ev-radio
kcInputClassRadioLabel=ev-check-label
kcInputClassRadioCheckboxLabelDisabled=ev-disabled
kcCheckClass=ev-check
kcCheckInputClass=ev-checkbox
kcCheckLabelClass=ev-check-label

## Boutons (Button de shadcn : default, outline, pleine largeur)
kcButtonClass=ev-button
kcButtonPrimaryClass=ev-button-primary
kcButtonDefaultClass=ev-button-outline
kcButtonBlockClass=ev-button-block
kcButtonLargeClass=

## Alertes (Alert de shadcn)
kcAlertClass=ev-alert
kcAlertTitleClass=ev-alert-description
kcFeedbackErrorIcon=ev-icon ev-icon-alert
kcFeedbackWarningIcon=ev-icon ev-icon-alert
kcFeedbackSuccessIcon=ev-icon ev-icon-check
kcFeedbackInfoIcon=ev-icon ev-icon-info

## Bouton œil (resources/js/passwordVisibility.js du thème de base)
kcFormPasswordVisibilityButtonClass=ev-button-icon
kcFormPasswordVisibilityIconShow=ev-icon ev-icon-eye
kcFormPasswordVisibilityIconHide=ev-icon ev-icon-eye-off

kcResetFlowIcon=ev-icon ev-icon-restart
kcSrOnlyClass=ev-sr-only
