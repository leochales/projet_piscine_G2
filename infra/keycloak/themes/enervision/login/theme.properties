# Thème de connexion EnerVision : mêmes couleurs, rayons et police que le front (shadcn-vue).
# Hérite du thème « keycloak » (pages, scripts, messages) ; seuls template.ftl, login.ftl
# et la feuille de style sont remplacés. Les classes kc* ci-dessous sont celles de nos
# gabarits et des autres pages du realm (erreur, mise à jour du mot de passe ou du
# profil...) : elles pointent vers les classes ev-* de css/enervision.css. Une classe vide
# retire celle de PatternFly héritée du thème parent.
parent=keycloak

## Formulaires
kcFormClass=ev-form
kcFormGroupClass=ev-field
kcLabelClass=ev-label
kcLabelWrapperClass=
kcInputClass=ev-input
kcInputWrapperClass=
kcInputGroup=ev-input-group
kcInputErrorMessageClass=ev-field-message
kcInputHelperTextBeforeClass=ev-field-help
kcInputHelperTextAfterClass=ev-field-help
kcContentWrapperClass=
kcFormOptionsClass=
kcFormOptionsWrapperClass=ev-form-options
kcFormButtonsClass=ev-form-buttons
kcSignUpClass=ev-card-info

## Boutons (Button de shadcn : default, outline, pleine largeur)
kcButtonClass=ev-button
kcButtonPrimaryClass=ev-button-primary
kcButtonDefaultClass=ev-button-outline
kcButtonBlockClass=ev-button-block
kcButtonLargeClass=

## Alertes (Alert de shadcn)
kcAlertClass=ev-alert
kcAlertTitleClass=ev-alert-description
kcFeedbackErrorIcon=ev-icon ev-icon-alert
kcFeedbackWarningIcon=ev-icon ev-icon-alert
kcFeedbackSuccessIcon=ev-icon ev-icon-check
kcFeedbackInfoIcon=ev-icon ev-icon-info

## Bouton œil (resources/js/passwordVisibility.js du thème de base)
kcFormPasswordVisibilityButtonClass=ev-button-icon
kcFormPasswordVisibilityIconShow=ev-icon ev-icon-eye
kcFormPasswordVisibilityIconHide=ev-icon ev-icon-eye-off

## Recommencer la connexion avec un autre compte
kcResetFlowIcon=ev-icon ev-icon-restart
