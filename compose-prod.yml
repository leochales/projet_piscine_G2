# Stack déployée sur la VM, et testée telle quelle en CI avant le déploiement.
#   CI  (.github/workflows/images.yml) : construit api, etl et front, teste la stack, scanne
#        les images, puis les publie sur GHCR, taguées par le SHA du commit
#   VM  (.github/workflows/deploy.yml) : docker compose pull, puis up --no-build ; la VM
#        démarre exactement les images testées, sans rien reconstruire
# IMAGE_REPO (ghcr.io/<owner>) et IMAGE_TAG (SHA du commit) sont fournis par les workflows.
# Pas de fichier .env : le workflow passe les variables (DEPLOY_ENV, POSTGRES_USER, mots de
# passe…) dans l'environnement, depuis les secrets et variables GitHub DEV_* / PROD_*.
#
# Différences avec compose-local.yml :
#   - pas de pgAdmin ni de Traefik : le Traefik partagé (infra/traefik/compose.yml) sert
#     tous les environnements en HTTPS, chacun sur son entrypoint (https-<DEPLOY_ENV>)
#   - Postgres n'est pas exposé hors du réseau Docker
#   - la supervision (Prometheus, Grafana, Loki, Alloy, postgres-exporter) démarre
#     avec le reste. Grafana est sur ${FRONT_URL}/grafana, aucun port publié.
#
# Les routes Traefik n'acceptent que les requêtes adressées à PUBLIC_HOST (IP de la VM,
# localhost en CI) : un autre en-tête Host reçoit le 404 de Traefik, sans redirection vers
# l'hôte demandé.
#
# Plusieurs environnements cohabitent sur la VM : chacun est un projet Docker distinct
# (enervision-<DEPLOY_ENV>), avec ses propres conteneurs, volumes et base.
# Les noms de routeurs Traefik sont préfixés par le projet pour rester uniques.
name: enervision-${DEPLOY_ENV:?DEPLOY_ENV manquant (dev ou prod)}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
      MODEL_DB_PASSWORD: ${MODEL_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # postgres-exporter s'en sert. Obligatoire : un mot de passe vide laisserait
      # le compte monitoring sans mot de passe, et l'exporter échouerait en silence.
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:?MONITORING_DB_PASSWORD manquant}
    volumes:
      - postgresql_data:/var/lib/postgresql
      # Scripts d'init : exécutés seulement au premier démarrage (volume vide)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - postgres_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command:
      - start
      - --import-realm
      # HTTP dans le réseau Docker : le HTTPS est assuré par Traefik
      - --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Adresse du front autorisée en retour de connexion (redirectUris du realm).
      # Pas de serveur Vite sur la VM : FRONT_DEV_URL reprend FRONT_URL.
      FRONT_URL: ${FRONT_URL}
      FRONT_DEV_URL: ${FRONT_URL}
      # Servi par Traefik sous /auth, à la même adresse que le front : https://<VM_IP>/auth
      # (prod) ou https://<VM_IP>:8443/auth (dev). L'adresse publique fixe l'émetteur (iss)
      # des jetons ; l'API joint quand même Keycloak en interne (keycloak-<env>:8080/auth).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${FRONT_URL}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-enervision.json:/opt/keycloak/data/import/realm-enervision.json:ro
      # Thème de connexion (loginTheme du realm), mis en cache par Keycloak
      - ./infra/keycloak/themes/enervision:/opt/keycloak/themes/enervision:ro
    labels:
      - traefik.enable=true
      # Version du thème (deploy.yml) : un thème modifié change le label, donc docker compose
      # recrée le conteneur, et Keycloak relit le thème au lieu de servir son cache.
      - enervision.keycloak-theme=${KEYCLOAK_THEME_VERSION:-}
      # Tout Keycloak : realm enervision (connexion, jetons, clés), console d'administration
      # (/auth/admin) et realm master, où se connectent ses administrateurs. Santé et
      # métriques restent sur le port de gestion (9000), non routé.
      - traefik.http.routers.enervision-${DEPLOY_ENV}-auth.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquant}`) && PathPrefix(`/auth`)
      - traefik.http.routers.enervision-${DEPLOY_ENV}-auth.entrypoints=https-${DEPLOY_ENV}
      # En-têtes de sécurité (infra/traefik/dynamic/middlewares.yml)
      - traefik.http.routers.enervision-${DEPLOY_ENV}-auth.middlewares=auth-headers@file
      - traefik.http.services.enervision-${DEPLOY_ENV}-auth.loadbalancer.server.port=8080
    healthcheck:
      # Port de gestion (9000), sous le même chemin relatif que Keycloak
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Démarrage lent (reconstruction de la configuration) : les échecs ne comptent pas
      # pendant ce délai. Tant que Keycloak n'est pas « healthy », Traefik ne le route pas.
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
    networks:
      postgres_network:
        # Nom propre à l'environnement : dev et prod partagent traefik_public, où le
        # nom « keycloak » désigne les deux Keycloak. L'API utilise cet alias.
        aliases:
          - keycloak-${DEPLOY_ENV}
      traefik_public:

  api:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-api:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: api
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
      # Émetteur des jetons = adresse publique de Keycloak (même valeur que KC_HOSTNAME)
      KEYCLOAK_EMETTEUR: ${FRONT_URL}/auth/realms/enervision
      # Clés de signature lues en interne, sur le Keycloak de CET environnement : pas
      # « keycloak », ambigu sur traefik_public (partagé par dev et prod)
      KEYCLOAK_URL_INTERNE: http://keycloak-${DEPLOY_ENV}:8080/auth
      # Front et API partagent la même origine derrière Traefik : aucun appel cross-origin
      API_CORS_ORIGINS: "[]"
      # Swagger et openapi.json masqués sauf demande explicite : true en dev (deploy.yml)
      # et en CI, où Schemathesis lit /api/openapi.json (images.yml)
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # Création des comptes (client enervision-admin) et comptes de démonstration
      # (api/seed.py) ; sans SEED_PASSWORD (secret <ENV>_SEED_PASSWORD), pas de seeding
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # En prod, le seeding ne crée pas les comptes qui voient tous les clients
      DEPLOY_ENV: ${DEPLOY_ENV}
    labels:
      - traefik.enable=true
      - traefik.http.routers.enervision-${DEPLOY_ENV}-api.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquant}`) && PathPrefix(`/api`)
      - traefik.http.routers.enervision-${DEPLOY_ENV}-api.entrypoints=https-${DEPLOY_ENV}
      # En-têtes de sécurité (infra/traefik/dynamic/middlewares.yml)
      - traefik.http.routers.enervision-${DEPLOY_ENV}-api.middlewares=security-headers@file
      - traefik.http.services.enervision-${DEPLOY_ENV}-api.loadbalancer.server.port=8000
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - postgres_network
      - traefik_public

  etl:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-etl:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: .
      dockerfile: etl/Dockerfile
    restart: unless-stopped
    environment:
      ETL_ENABLED: ${ETL_ENABLED:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: ${ETL_DB_PASSWORD}
      # Prix du kWh pour le gain estimé des recommandations (même valeur que l'API)
      PRIX_KWH_EUR: ${PRIX_KWH_EUR:-0.14}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  # Sauvegarde nocturne chiffrée des bases enervision et keycloak vers le stockage
  # Azure (infra/terraform), un conteneur restic-<DEPLOY_ENV> par environnement
  backup:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-backup:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    environment:
      # Obligatoire : backup.sh en déduit le seul dépôt accepté (azure:restic-<env>:/)
      DEPLOY_ENV: ${DEPLOY_ENV:?DEPLOY_ENV manquant (dev ou prod)}
      PGHOST: db
      PGUSER: backup
      # La base de l'application porte le nom POSTGRES_DB de l'environnement (pas
      # forcément « enervision »), puis celle de Keycloak, toujours « keycloak »
      BACKUP_DATABASES: ${POSTGRES_DB} keycloak
      PGPASSWORD: ${BACKUP_DB_PASSWORD}
      RESTIC_REPOSITORY: azure:restic-${DEPLOY_ENV}:/
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AZURE_ACCOUNT_NAME: ${AZURE_ACCOUNT_NAME}
      AZURE_ACCOUNT_SAS: ${AZURE_ACCOUNT_SAS}
    volumes:
      # Cache des index restic : évite de les retélécharger depuis Azure à chaque nuit
      - backup_cache:/home/backup/.cache/restic
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000
      --static-prefix /mlflow
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/mlflow/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mlflow_network

  dataset:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-model:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: .
      dockerfile: model/Dockerfile
    profiles: ["jobs"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000/mlflow
      DATASET_RAW_DIR: /data/raw
      DATASET_OUTPUT_DIR: /data/processed
    volumes:
      - ${DATASET_RAW_DIR:-./data/raw}:/data/raw:ro
      - dataset_data:/data/processed
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlflow_network

  # Entraînement du modèle sur le jeu du volume dataset_data et enregistrement dans le
  # MLflow de l'environnement (SMARTOPS-32), lancé par le workflow Dataset après le jeu.
  # Même image que dataset : le déploiement la garde déjà.
  entrainement:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-model:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: .
      dockerfile: model/Dockerfile
    profiles: ["jobs"]
    command: ["python", "-m", "model.entrainement"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000/mlflow
      DATASET_OUTPUT_DIR: /data/processed
    volumes:
      - dataset_data:/data/processed:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlflow_network

  # Prévisions de chaque heure dans gold.prediction (SMARTOPS-33, model/crontab), avec
  # les versions production du MLflow de l'environnement. Démarré avec la stack : il
  # garde aussi l'image du modèle pour les jobs dataset et entrainement.
  prevision:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-model:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: .
      dockerfile: model/Dockerfile
    restart: unless-stopped
    command: ["supercronic", "-passthrough-logs", "model/crontab"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000/mlflow
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: model
      POSTGRES_PASSWORD: ${MODEL_DB_PASSWORD}
      # Versions des modèles téléchargées une seule fois, gardées entre deux lancements
      MODELE_CACHE_DIR: /cache
    volumes:
      - modele_cache:/cache
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - postgres_network
      - mlflow_network

  front:
    image: ${IMAGE_REPO:?IMAGE_REPO manquant}/enervision-front:${IMAGE_TAG:?IMAGE_TAG manquant}
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.enervision-${DEPLOY_ENV}-front.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquant}`) && PathPrefix(`/`)
      - traefik.http.routers.enervision-${DEPLOY_ENV}-front.entrypoints=https-${DEPLOY_ENV}
      - traefik.http.routers.enervision-${DEPLOY_ENV}-front.middlewares=security-headers@file,front-csp@file
      - traefik.http.services.enervision-${DEPLOY_ENV}-front.loadbalancer.server.port=8080
    depends_on:
      - api
    networks:
      - traefik_public

  # ---------------------------------------------------------------------------
  # Supervision : démarre avec le reste de la stack. Même pile que
  # compose-local.yml. Aucun port publié : Grafana passe par le Traefik
  # partagé, sous /grafana.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_network
      # Cibles traefik:8082 (Traefik partagé) et api:8000
      - traefik_public

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:?MONITORING_DB_PASSWORD manquant}
      # Totaux métier (db/19_supervision_metier.sql), en plus des stats PostgreSQL
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./infra/monitoring/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network
      - monitoring_network

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Lecture seule : Alloy liste les conteneurs et lit leurs logs.
      # Le proxy de socket de Traefik ne sert pas les logs (SMARTOPS-82).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring_network

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      # Servi sous /grafana par Traefik (sans retirer le préfixe).
      # FRONT_URL : https://<VM_IP>:8443 en dev, https://<VM_IP> en prod.
      GF_SERVER_ROOT_URL: ${FRONT_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      # Obligatoire : vide, Grafana démarre avec admin / admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Sources de données et tableaux de bord décrits dans le dépôt
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.enervision-${DEPLOY_ENV}-grafana.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST manquant}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.enervision-${DEPLOY_ENV}-grafana.entrypoints=https-${DEPLOY_ENV}
      - traefik.http.services.enervision-${DEPLOY_ENV}-grafana.loadbalancer.server.port=3000
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring_network
      - traefik_public

volumes:
  postgresql_data:
  mlflow_data:
  modele_cache:
  dataset_data:
  backup_cache:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  postgres_network:
  mlflow_network:
  # Prometheus, Grafana, Loki, Alloy et postgres-exporter. Propre au projet
  # Compose : dev et prod ne partagent pas cette supervision.
  monitoring_network:
  # Créé par infra/traefik/compose.yml
  traefik_public:
    external: true
